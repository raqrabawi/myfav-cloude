name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + forbidden-content check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Figma Make package (browser-only check)
        run: npm run package:figma
      - name: Upload Figma Make package
        uses: actions/upload-artifact@v4
        with:
          name: myfav-figma-make
          path: dist-figma/myfav-figma-make/
          retention-days: 30
      - name: Apply local Neon-equivalent shim + migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          bash scripts/local-db.sh
      - name: Database / RLS / RPC tests
        run: npm run test:db
